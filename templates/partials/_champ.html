<div class="mb-3">
  {% if champ.field.widget.input_type == "checkbox" %}
    <div class="form-check">{{ champ }} <label class="form-check-label" for="{{ champ.id_for_label }}">{{ champ.label }}</label></div>
  {% else %}
    <label for="{{ champ.id_for_label }}" class="form-label fw-semibold">{{ champ.label }}</label>
    {{ champ }}
  {% endif %}
  {% for erreur in champ.errors %}<div class="invalid-feedback d-block">{{ erreur }}</div>{% endfor %}
  {% if champ.help_text %}<div class="form-text">{{ champ.help_text }}</div>{% endif %}
</div>
